  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #1e293b; }
    
    #app-container { display: flex; width: 100%; height: 100%; position: relative; }
    #map { flex: 1; height: 100%; z-index: 1; }

    /* Top Floating Search & Filter */
    .top-bar {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .search-box {
      pointer-events: auto; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px);
      border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      display: flex; align-items: center; padding: 8px 14px; gap: 10px;
    }
    .search-box input {
      flex: 1; border: none; outline: none; font-size: 14px; background: transparent; color: #0f172a;
    }
    .search-box i { color: #64748b; font-size: 15px; }

    .pills-scroll {
      pointer-events: auto; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
      scrollbar-width: none;
    }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill {
      white-space: nowrap; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      background: rgba(15, 23, 42, 0.88); color: #f8fafc; backdrop-filter: blur(8px);
      cursor: pointer; border: 1px solid rgba(255,255,255,0.15); transition: all 0.2s;
    }
    .pill.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
    .pill-titip.active { background: #d97706; border-color: #f59e0b; }
    .pill-selesai.active { background: #16a34a; border-color: #22c55e; }

    /* Quick Action FABs */
    .fab-group {
      position: absolute; right: 14px; bottom: 85px; z-index: 1000;
      display: flex; flex-direction: column; gap: 10px;
    }
    .fab-btn {
      width: 44px; height: 44px; border-radius: 22px; background: #ffffff;
      color: #1e293b; border: none; box-shadow: 0 4px 14px rgba(0,0,0,0.22);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
      cursor: pointer; transition: transform 0.15s, background 0.2s;
    }
    .fab-btn:active { transform: scale(0.92); }
    .fab-btn.active { background: #2563eb; color: #fff; }

    /* Bottom Sheet / Drawer */
    #bottom-sheet {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1001;
      background: #ffffff; border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 25px rgba(0,0,0,0.2);
      transform: translateY(calc(100% - 68px));
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; max-height: 82vh;
    }
    #bottom-sheet.open { transform: translateY(0); }
    #bottom-sheet.peek { transform: translateY(calc(100% - 210px)); }

    .sheet-handle-bar {
      padding: 10px 0 4px 0; display: flex; justify-content: center; cursor: pointer;
    }
    .sheet-handle {
      width: 40px; height: 5px; border-radius: 3px; background: #cbd5e1;
    }
    .sheet-header {
      padding: 6px 16px 12px 16px; border-bottom: 1px solid #f1f5f9;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sheet-title { font-size: 15px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 6px; }
    .sheet-count { font-size: 12px; color: #16a34a; font-weight: 700; }

    /* Progress bar */
    .progress-bar-container {
      height: 4px; background: #e2e8f0; width: 100%; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: #16a34a; width: 0%; transition: width 0.3s;
    }

    .sheet-content {
      flex: 1; overflow-y: auto; padding: 10px 14px 24px 14px; display: flex; flex-direction: column; gap: 8px;
    }

    /* Respondent Card with Checkbox */
    .resp-card {
      background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px;
      padding: 10px 12px; cursor: pointer; transition: all 0.2s; display: flex; gap: 10px; align-items: flex-start;
    }
    .resp-card.is-done {
      background: #f0fdf4; border-color: #86efac;
    }
    .resp-card.is-done .card-name {
      color: #15803d; text-decoration: line-through; opacity: 0.85;
    }
    
    /* Checkbox Button */
    .check-btn {
      margin-top: 2px; width: 34px; height: 34px; border-radius: 10px;
      border: 2px solid #94a3b8; background: #ffffff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; color: transparent; flex-shrink: 0;
      transition: all 0.2s;
    }
    .resp-card.is-done .check-btn {
      background: #16a34a; border-color: #16a34a; color: #ffffff;
    }

    .card-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    .card-name { font-size: 14px; font-weight: 700; color: #0f172a; line-height: 1.3; }
    
    .badges-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 2px; }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; color: #fff;
    }
    .badge-gabungan { background: #dc2626; }
    .badge-ssb { background: #2563eb; }
    .badge-shbj { background: #059669; }
    .badge-titip { background: #d97706; }
    .badge-done { background: #16a34a; }
    .badge-pending { background: #64748b; }

    .titip-box {
      font-size: 11px; font-weight: 600; color: #b45309; background: #fef3c7;
      padding: 3px 8px; border-radius: 6px; border: 1px solid #fde68a; display: flex; align-items: center; gap: 4px;
    }

    .card-meta { font-size: 12px; color: #64748b; display: flex; flex-wrap: wrap; gap: 8px; }
    .card-notes { font-size: 11px; color: #d97706; background: #fffbeb; padding: 3px 6px; border-radius: 4px; }

    .card-actions {
      display: flex; gap: 6px; margin-top: 4px;
    }
    .btn-action {
      flex: 1; padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 600;
      text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 4px;
      border: none; cursor: pointer;
    }
    .btn-gmaps { background: #2563eb; color: #ffffff !important; }
    .btn-detail { background: #e2e8f0; color: #334155 !important; }

    /* Custom Leaflet Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 12px; padding: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .leaflet-popup-content { margin: 10px; line-height: 1.4; }
    .pop-title { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .pop-info { font-size: 12px; color: #475569; margin: 6px 0; }
    .pop-toggle-btn {
      display: block; width: 100%; padding: 7px; border-radius: 8px; margin-bottom: 6px;
      font-size: 12px; font-weight: 700; text-align: center; cursor: pointer; border: none;
    }
    .pop-toggle-done { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .pop-toggle-undone { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .pop-btn {
      display: block; width: 100%; padding: 7px; border-radius: 8px;
      background: #2563eb; color: #fff !important; font-size: 12px; font-weight: 700;
      text-align: center; text-decoration: none;
    }
  </style>

  <div id="app-container">
    <div id="map"></div>

    <!-- Top floating search & filter -->
    <div class="top-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Cari responden, wilayah, tgl..." oninput="handleSearch()">
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="clearSearch()"></i>
      </div>
      <div class="pills-scroll">
        <div class="pill active" onclick="setFilter('ALL')">Semua (84)</div>
        <div class="pill pill-titip" onclick="setFilter('TITIP')">Titip Dokumen (17)</div>
        <div class="pill" onclick="setFilter('BELUM')">Belum Selesai</div>
        <div class="pill pill-selesai" onclick="setFilter('SELESAI')">Sudah Selesai</div>
        <div class="pill" onclick="setFilter('SSB')">SSB (35)</div>
        <div class="pill" onclick="setFilter('SHBJ')">SHBJ (54)</div>
        <div class="pill" onclick="setFilter('SSB & SHBJ (Gabungan)')">Gabungan (5)</div>
      </div>
    </div>

    <!-- Action Buttons (Layer Satelit, GPS, Drawer) -->
    <div class="fab-group">
      <button class="fab-btn" id="satBtn" title="Ganti Satelit" onclick="toggleSatellite()">
        <i class="fa-solid fa-layer-group"></i>
      </button>
      <button class="fab-btn" id="gpsBtn" title="Lokasi Saya" onclick="locateUser()">
        <i class="fa-solid fa-location-crosshairs"></i>
      </button>
      <button class="fab-btn" id="listBtn" title="Daftar Titik" onclick="toggleSheet()">
        <i class="fa-solid fa-list-check"></i>
      </button>
    </div>

    <!-- Bottom Sheet / Drawer -->
    <div id="bottom-sheet" class="peek">
      <div class="sheet-handle-bar" onclick="toggleSheet()">
        <div class="sheet-handle"></div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="sheet-header">
        <span class="sheet-title">
          <i class="fa-solid fa-clipboard-check" style="color:#2563eb;"></i>
          Checklist Lapangan
        </span>
        <span class="sheet-count" id="progressLabel">0/84 Selesai</span>
      </div>
      <div class="sheet-content" id="sheetList">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

pi=1&destination=-0.8632573,134.0477907", "pic": "Abid"}, {"no": 82, "nama": "Makarios", "lokasi": "Sowi", "kategori": "SHBJ", "survei": "SHBJ", "notes": "", "status": "Titip Dokumen", "tanggal": "22/10/2026", "hari_lengkap": "Kamis, 22 Okt", "has_coords": true, "lat": -0.8864007, "lon": 134.0460821, "title": "CV. MAKARIOS", "link": "https://maps.app.goo.gl/nyvTZNBDkXAguJyz5", "init_done": false, "dir_url": "https://www.google.com/maps/dir/?api=1&destination=-0.8864007,134.0460821", "pic": "Marcsha"}, {"no": 83, "nama": "Wicom", "lokasi": "Wosi", "kategori": "SHBJ", "survei": "SHBJ", "notes": "", "status": "Titip Dokumen", "tanggal": "26/10/2026", "hari_lengkap": "Senin, 26 Okt", "has_coords": true, "lat": -0.8630717, "lon": 134.050696, "title": "WICOM KOMPUTER - Toko Laptop, cctv, Printer & Servis Komputer Manokwari", "link": "https://maps.app.goo.gl/SPsftf43Ftehi6RX9", "init_done": false, "dir_url": "https://www.google.com/maps/dir/?api=1&destination=-0.8630717,134.050696", "pic": "Marcsha"}, {"no": 84, "nama": "Depan Bingxue", "lokasi": "Jalan Baru", "kategori": "SHBJ", "survei": "SHBJ", "notes": "CV. Halim Motor", "status": "Selesai", "tanggal": "21/10/2026", "hari_lengkap": "Rabu, 21 Okt", "has_coords": true, "lat": -0.870612, "lon": 134.046103, "title": "CV. HALIM MOTOR (Depan Bingxue)", "link": "https://maps.google.com/?q=-0.870612,134.046103", "init_done": true, "dir_url": "https://www.google.com/maps/dir/?api=1&destination=-0.870612,134.046103", "drop_batch": "19 Okt", "pic": "-"}];
    const STORAGE_KEY = 'manokwari_survei_done_v2';

    // Load persisted checklist
    let doneSet = new Set();
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        doneSet = new Set(JSON.parse(saved));
      } else {
        // Initialize from spreadsheet initial status
        rawData.forEach(p => {
          if (p.init_done) doneSet.add(p.no);
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(doneSet)));
      }
    } catch(e) {
      console.error(e);
    }

    function saveChecklist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(doneSet)));
      } catch(e) {}
      updateProgress();
      render();
    }

    function toggleCheck(no) {
      if (doneSet.has(no)) {
        doneSet.delete(no);
      } else {
        doneSet.add(no);
      }
      saveChecklist();
    }

    let currentFilter = 'ALL';
    let searchQuery = '';
    let activeSatellite = false;
    let gpsMarker = null;

    // Initialize Map
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([-0.865, 134.06], 13);

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    const satLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 });

    function toggleSatellite() {
      const btn = document.getElementById('satBtn');
      if (activeSatellite) {
        map.removeLayer(satLayer);
        map.addLayer(osmLayer);
        btn.classList.remove('active');
        activeSatellite = false;
      } else {
        map.removeLayer(osmLayer);
        map.addLayer(satLayer);
        btn.classList.add('active');
        activeSatellite = true;
      }
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert('Browser tidak mendukung GPS');
        return;
      }
      const btn = document.getElementById('gpsBtn');
      btn.style.color = '#2563eb';
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.flyTo([lat, lon], 16);
        if (gpsMarker) map.removeLayer(gpsMarker);
        gpsMarker = L.circleMarker([lat, lon], {
          radius: 9, fillColor: '#0284c7', color: '#fff', weight: 3, fillOpacity: 0.95
        }).addTo(map).bindPopup('<b>Lokasi Anda Sekarang</b>').openPopup();
        btn.style.color = '#1e293b';
      }, err => {
        alert('Gagal mengambil GPS: ' + err.message);
        btn.style.color = '#1e293b';
      }, { enableHighAccuracy: true });
    }

    const sheet = document.getElementById('bottom-sheet');
    function toggleSheet() {
      if (sheet.classList.contains('open')) {
        sheet.classList.remove('open');
        sheet.classList.add('peek');
      } else {
        sheet.classList.add('open');
        sheet.classList.remove('peek');
      }
    }

    function updateProgress() {
      const total = rawData.length;
      const done = doneSet.size;
      const pct = Math.round((done / total) * 100);
      document.getElementById('progressLabel').innerText = `${done}/${total} Selesai (${pct}%)`;
      document.getElementById('progressFill').style.width = `${pct}%`;
    }

    function getColor(p, isDone) {
      if (isDone) return '#16a34a'; // Green if done
      if (p.status === 'Titip Dokumen') return '#d97706'; // Amber if titip dokumen
      if (p.kategori === 'SSB & SHBJ (Gabungan)') return '#dc2626'; // Red
      if (p.kategori === 'SSB') return '#2563eb'; // Blue
      return '#059669'; // Emerald
    }

    let markerMap = {};

    function render() {
      // Filter logic
      const filtered = rawData.filter(p => {
        const isDone = doneSet.has(p.no);
        
        let matchFilter = true;
        if (currentFilter === 'TITIP') matchFilter = (p.status === 'Titip Dokumen');
        else if (currentFilter === 'BELUM') matchFilter = !isDone;
        else if (currentFilter === 'SELESAI') matchFilter = isDone;
        else if (currentFilter === 'SSB') matchFilter = p.survei.includes('SSB');
        else if (currentFilter === 'SHBJ') matchFilter = p.survei.includes('SHBJ');
        else if (currentFilter === 'SSB & SHBJ (Gabungan)') matchFilter = (p.kategori === currentFilter);

        const matchSearch = (!searchQuery || 
          p.nama.toLowerCase().includes(searchQuery) ||
          p.lokasi.toLowerCase().includes(searchQuery) ||
          (p.notes && p.notes.toLowerCase().includes(searchQuery)) ||
          (p.hari_lengkap && p.hari_lengkap.toLowerCase().includes(searchQuery)) ||
          p.no.toString().includes(searchQuery)
        );

        return matchFilter && matchSearch;
      });

      // Clear markers
      Object.values(markerMap).forEach(m => map.removeLayer(m));
      markerMap = {};

      const listContainer = document.getElementById('sheetList');
      listContainer.innerHTML = '';

      filtered.forEach(p => {
        const isDone = doneSet.has(p.no);
        const color = getColor(p, isDone);

        // Marker (only if coordinates exist)
        if (p.has_coords) {
          const marker = L.circleMarker([p.lat, p.lon], {
            radius: isDone ? 7 : (p.status === 'Titip Dokumen' ? 10 : 8),
            fillColor: color,
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: isDone ? 0.65 : 0.95
          }).addTo(map);

          let popupHtml = `
            <div class="pop-title">#${p.no} ${p.nama}</div>
            <div style="display:flex;gap:4px;margin-bottom:6px;">
              <span class="badge ${p.kategori.includes('Gabungan') ? 'badge-gabungan' : p.kategori.includes('SSB') ? 'badge-ssb' : 'badge-shbj'}">${p.kategori}</span>
              ${p.status === 'Titip Dokumen' ? `<span class="badge badge-titip">Titip Dokumen</span>` : ''}
            </div>
            ${p.status === 'Titip Dokumen' ? `<div class="titip-box"><i class="fa-solid fa-calendar-check"></i> Ambil: <b>${p.hari_lengkap}</b></div>` : ''}
            <div class="pop-info">
              <i class="fa-solid fa-location-dot"></i> ${p.lokasi}<br/>
              ${p.notes ? `<i class="fa-solid fa-comment-dots"></i> ${p.notes}<br/>` : ''}
            </div>
            <button class="pop-toggle-btn ${isDone ? 'pop-toggle-done' : 'pop-toggle-undone'}" onclick="toggleCheck(${p.no})">
              ${isDone ? '<i class="fa-solid fa-check"></i> Sudah Selesai (Klik Batal)' : '<i class="fa-regular fa-square"></i> Tandai Selesai'}
            </button>
            <a class="pop-btn" href="${p.dir_url}" target="_blank">
              <i class="fa-solid fa-diamond-turn-right"></i> Rute Navigasi Google Maps
            </a>
          `;
          marker.bindPopup(popupHtml);
          markerMap[p.no] = marker;
        }

        // Card in Sheet
        const card = document.createElement('div');
        card.className = `resp-card ${isDone ? 'is-done' : ''}`;
        card.innerHTML = `
          <button class="check-btn" onclick="toggleCheck(${p.no}); event.stopPropagation();" title="Centang Selesai">
            <i class="fa-solid fa-check"></i>
          </button>
          <div class="card-body">
            <div class="card-top">
              <span class="card-name">#${p.no} ${p.nama}</span>
              <span class="badge ${isDone ? 'badge-done' : (p.status === 'Titip Dokumen' ? 'badge-titip' : 'badge-pending')}">
                ${isDone ? 'Selesai' : p.status}
              </span>
            </div>
            
            <div class="badges-row">
              <span class="badge ${p.kategori.includes('Gabungan') ? 'badge-gabungan' : p.kategori.includes('SSB') ? 'badge-ssb' : 'badge-shbj'}">${p.survei}</span>
              ${p.status === 'Titip Dokumen' ? `
                <span class="titip-box">
                  <i class="fa-solid fa-calendar-days"></i> Ambil: <b>${p.hari_lengkap}</b>
                </span>
              ` : ''}
            </div>

            <div class="card-meta">
              <span><i class="fa-solid fa-location-dot"></i> ${p.lokasi}</span>
              ${p.notes ? `<span class="card-notes"><i class="fa-solid fa-info-circle"></i> ${p.notes}</span>` : ''}
            </div>

            <div class="card-actions">
              ${p.has_coords ? `
                <button class="btn-action btn-detail" onclick="focusPoint(${p.no})">
                  <i class="fa-solid fa-map-pin"></i> Peta
                </button>
                <a class="btn-action btn-gmaps" href="${p.dir_url}" target="_blank">
                  <i class="fa-solid fa-diamond-turn-right"></i> GMaps
                </a>
              ` : `
                <span style="font-size:11px;color:#94a3b8;font-style:italic;">Belum ada koordinat map</span>
              `}
            </div>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function focusPoint(no) {
      const p = rawData.find(x => x.no === no);
      if (p && markerMap[no]) {
        map.flyTo([p.lat, p.lon], 16, { duration: 0.8 });
        markerMap[no].openPopup();
        sheet.classList.remove('open');
        sheet.classList.add('peek');
      }
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.pill').forEach(btn => {
        const text = btn.innerText;
        btn.classList.remove('active');
        if (filterType === 'ALL' && text.includes('Semua')) btn.classList.add('active');
        if (filterType === 'TITIP' && text.includes('Titip')) btn.classList.add('active');
        if (filterType === 'BELUM' && text.includes('Belum')) btn.classList.add('active');
        if (filterType === 'SELESAI' && text.includes('Sudah')) btn.classList.add('active');
        if (filterType === 'SSB' && text.includes('SSB (')) btn.classList.add('active');
        if (filterType === 'SHBJ' && text.includes('SHBJ (')) btn.classList.add('active');
        if (filterType === 'SSB & SHBJ (Gabungan)' && text.includes('Gabungan')) btn.classList.add('active');
      });
      render();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      render();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      render();
    }

    updateProgress();
    render();
  </script>
</body>
</html>
