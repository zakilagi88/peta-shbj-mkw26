<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Peta Titik Survei BPS Manokwari (SSB & SHBJ)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #1e293b; }
    
    #app-container { display: flex; width: 100%; height: 100%; position: relative; }
    #map { flex: 1; height: 100%; z-index: 1; }

    /* Floating Header Search & Pills */
    .top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .search-box {
      pointer-events: auto; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
      border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.18);
      display: flex; align-items: center; padding: 8px 14px; gap: 10px;
    }
    .search-box input {
      flex: 1; border: none; outline: none; font-size: 14px; background: transparent; color: #0f172a;
    }
    .search-box i { color: #64748b; font-size: 15px; }

    .pills-scroll {
      pointer-events: auto; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
      scrollbar-width: none;
    }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill {
      white-space: nowrap; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      background: rgba(15, 23, 42, 0.85); color: #f8fafc; backdrop-filter: blur(8px);
      cursor: pointer; border: 1px solid rgba(255,255,255,0.15); transition: all 0.2s;
    }
    .pill.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
    .pill-red.active { background: #dc2626; border-color: #ef4444; }
    .pill-green.active { background: #16a34a; border-color: #22c55e; }

    /* Quick Action Buttons (GPS, Satellite, List) */
    .fab-group {
      position: absolute; right: 14px; bottom: 85px; z-index: 1000;
      display: flex; flex-direction: column; gap: 10px;
    }
    .fab-btn {
      width: 44px; height: 44px; border-radius: 22px; background: #ffffff;
      color: #1e293b; border: none; box-shadow: 0 4px 14px rgba(0,0,0,0.22);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
      cursor: pointer; transition: transform 0.15s, background 0.2s;
    }
    .fab-btn:active { transform: scale(0.92); }
    .fab-btn.active { background: #2563eb; color: #fff; }

    /* Bottom Sheet / Drawer */
    #bottom-sheet {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1001;
      background: #ffffff; border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 25px rgba(0,0,0,0.2);
      transform: translateY(calc(100% - 64px));
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; max-height: 80vh;
    }
    #bottom-sheet.open { transform: translateY(0); }
    #bottom-sheet.peek { transform: translateY(calc(100% - 190px)); }

    .sheet-handle-bar {
      padding: 10px 0 4px 0; display: flex; justify-content: center; cursor: pointer;
    }
    .sheet-handle {
      width: 40px; height: 5px; border-radius: 3px; background: #cbd5e1;
    }
    .sheet-header {
      padding: 6px 18px 12px 18px; border-bottom: 1px solid #f1f5f9;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sheet-title { font-size: 15px; font-weight: 700; color: #0f172a; }
    .sheet-count { font-size: 12px; color: #64748b; font-weight: 600; }

    .sheet-content {
      flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
    }

    /* Respondent Card */
    .resp-card {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 12px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; gap: 6px;
    }
    .resp-card:hover, .resp-card.active {
      background: #eff6ff; border-color: #93c5fd;
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    .card-name { font-size: 14px; font-weight: 700; color: #0f172a; }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; color: #fff;
    }
    .badge-gabungan { background: #dc2626; }
    .badge-ssb { background: #2563eb; }
    .badge-shbj { background: #16a34a; }

    .card-meta { font-size: 12px; color: #64748b; display: flex; flex-wrap: wrap; gap: 8px; }
    .card-notes { font-size: 11px; color: #d97706; background: #fffbeb; padding: 4px 8px; border-radius: 6px; }

    .card-actions {
      display: flex; gap: 8px; margin-top: 4px;
    }
    .btn-action {
      flex: 1; padding: 7px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
      text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 5px;
      border: none; cursor: pointer;
    }
    .btn-gmaps { background: #2563eb; color: #ffffff !important; }
    .btn-detail { background: #e2e8f0; color: #334155 !important; }

    /* Custom Leaflet Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 12px; padding: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .leaflet-popup-content { margin: 10px; line-height: 1.4; }
    .pop-title { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .pop-badge { margin-bottom: 6px; display: inline-block; }
    .pop-info { font-size: 12px; color: #475569; margin-bottom: 8px; }
    .pop-btn {
      display: block; width: 100%; padding: 8px 10px; border-radius: 8px;
      background: #2563eb; color: #fff !important; font-size: 12px; font-weight: 700;
      text-align: center; text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="map"></div>

    <!-- Top floating search & filter -->
    <div class="top-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Cari responden, toko, wilayah..." oninput="handleSearch()">
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="clearSearch()"></i>
      </div>
      <div class="pills-scroll">
        <div class="pill active" onclick="setFilter('ALL')">Semua (70)</div>
        <div class="pill pill-red" onclick="setFilter('SSB & SHBJ (Gabungan)')">Gabungan (5)</div>
        <div class="pill" onclick="setFilter('SSB')">SSB (22)</div>
        <div class="pill pill-green" onclick="setFilter('SHBJ')">SHBJ (43)</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="fab-group">
      <button class="fab-btn" id="satBtn" title="Ganti Satelit" onclick="toggleSatellite()">
        <i class="fa-solid fa-layer-group"></i>
      </button>
      <button class="fab-btn" id="gpsBtn" title="Lokasi Saya" onclick="locateUser()">
        <i class="fa-solid fa-location-crosshairs"></i>
      </button>
      <button class="fab-btn" id="listBtn" title="Daftar Titik" onclick="toggleSheet()">
        <i class="fa-solid fa-list-ul"></i>
      </button>
    </div>

    <!-- Bottom Sheet / Drawer -->
    <div id="bottom-sheet" class="peek">
      <div class="sheet-handle-bar" onclick="toggleSheet()">
        <div class="sheet-handle"></div>
      </div>
      <div class="sheet-header">
        <span class="sheet-title">Daftar Titik Survei</span>
        <span class="sheet-count" id="countLabel">70 Titik</span>
      </div>
      <div class="sheet-content" id="sheetList">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

&query=-0.8554639,134.0702895", "dir_url": "https://www.google.com/maps/dir/?api=1&destination=-0.8554639,134.0702895"}, {"no": 81, "nama": "Penjahit Raihan", "lokasi": "Sowi", "kategori": "SSB", "survei": "SSB", "notes": "", "lat": -0.8632573, "lon": 134.0477907, "title": "Penjahit Raihan", "maps_url": "https://www.google.com/maps/search/?api=1&query=-0.8632573,134.0477907", "dir_url": "https://www.google.com/maps/dir/?api=1&destination=-0.8632573,134.0477907"}, {"no": 82, "nama": "Makarios", "lokasi": "Sowi", "kategori": "SHBJ", "survei": "SHBJ", "notes": "", "lat": -0.8864007, "lon": 134.0460821, "title": "CV. MAKARIOS", "maps_url": "https://www.google.com/maps/search/?api=1&query=-0.8864007,134.0460821", "dir_url": "https://www.google.com/maps/dir/?api=1&destination=-0.8864007,134.0460821"}, {"no": 83, "nama": "Wicom", "lokasi": "Wosi", "kategori": "SHBJ", "survei": "SHBJ", "notes": "", "lat": -0.8630717, "lon": 134.050696, "title": "WICOM KOMPUTER - Toko Laptop, cctv, Printer & Servis Komputer Manokwari", "maps_url": "https://www.google.com/maps/search/?api=1&query=-0.8630717,134.050696", "dir_url": "https://www.google.com/maps/dir/?api=1&destination=-0.8630717,134.050696"}];

    let currentFilter = 'ALL';
    let searchQuery = '';
    let activeSatellite = false;
    let gpsMarker = null;

    // Initialize Map
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([-0.865, 134.06], 13);

    // Tiles
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    const satLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20
    });

    function toggleSatellite() {
      const btn = document.getElementById('satBtn');
      if (activeSatellite) {
        map.removeLayer(satLayer);
        map.addLayer(osmLayer);
        btn.classList.remove('active');
        activeSatellite = false;
      } else {
        map.removeLayer(osmLayer);
        map.addLayer(satLayer);
        btn.classList.add('active');
        activeSatellite = true;
      }
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert('Browser tidak mendukung GPS');
        return;
      }
      const btn = document.getElementById('gpsBtn');
      btn.style.color = '#2563eb';
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.flyTo([lat, lon], 16);
        if (gpsMarker) map.removeLayer(gpsMarker);
        gpsMarker = L.circleMarker([lat, lon], {
          radius: 9, fillColor: '#0284c7', color: '#fff', weight: 3, fillOpacity: 0.95
        }).addTo(map).bindPopup('<b>Lokasi Anda Sekarang</b>').openPopup();
        btn.style.color = '#1e293b';
      }, err => {
        alert('Gagal mengambil GPS: ' + err.message);
        btn.style.color = '#1e293b';
      }, { enableHighAccuracy: true });
    }

    // Sheet toggle
    const sheet = document.getElementById('bottom-sheet');
    function toggleSheet() {
      if (sheet.classList.contains('open')) {
        sheet.classList.remove('open');
        sheet.classList.add('peek');
      } else {
        sheet.classList.add('open');
        sheet.classList.remove('peek');
      }
    }

    function getColor(kat) {
      if (kat === 'SSB & SHBJ (Gabungan)') return '#dc2626';
      if (kat === 'SSB') return '#2563eb';
      return '#16a34a';
    }

    function getBadgeClass(kat) {
      if (kat === 'SSB & SHBJ (Gabungan)') return 'badge-gabungan';
      if (kat === 'SSB') return 'badge-ssb';
      return 'badge-shbj';
    }

    let markerMap = {};

    function render() {
      // Filter data
      const filtered = pointsData.filter(p => {
        const matchKat = (currentFilter === 'ALL' || p.kategori === currentFilter);
        const matchSearch = (!searchQuery || 
          p.nama.toLowerCase().includes(searchQuery) ||
          p.lokasi.toLowerCase().includes(searchQuery) ||
          (p.notes && p.notes.toLowerCase().includes(searchQuery)) ||
          p.no.toString().includes(searchQuery)
        );
        return matchKat && matchSearch;
      });

      document.getElementById('countLabel').innerText = `${filtered.length} Titik`;

      // Clear existing markers
      Object.values(markerMap).forEach(m => map.removeLayer(m));
      markerMap = {};

      const listContainer = document.getElementById('sheetList');
      listContainer.innerHTML = '';

      filtered.forEach(p => {
        const color = getColor(p.kategori);
        const badgeCls = getBadgeClass(p.kategori);

        // Marker
        const marker = L.circleMarker([p.lat, p.lon], {
          radius: p.kategori === 'SSB & SHBJ (Gabungan)' ? 9 : 7,
          fillColor: color,
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map);

        const popupHtml = `
          <div class="pop-title">#${p.no} ${p.nama}</div>
          <div class="pop-badge"><span class="badge ${badgeCls}">${p.kategori}</span></div>
          <div class="pop-info">
            <i class="fa-solid fa-location-dot"></i> ${p.lokasi}<br/>
            ${p.notes ? `<i class="fa-solid fa-comment-dots"></i> <i>${p.notes}</i><br/>` : ''}
          </div>
          <a class="pop-btn" href="${p.dir_url}" target="_blank">
            <i class="fa-solid fa-diamond-turn-right"></i> Rute Navigasi Google Maps
          </a>
        `;
        marker.bindPopup(popupHtml);
        markerMap[p.no] = marker;

        // Card in Sheet
        const card = document.createElement('div');
        card.className = 'resp-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="card-name">#${p.no} ${p.nama}</span>
            <span class="badge ${badgeCls}">${p.kategori}</span>
          </div>
          <div class="card-meta">
            <span><i class="fa-solid fa-location-dot"></i> ${p.lokasi}</span>
          </div>
          ${p.notes ? `<div class="card-notes"><i class="fa-solid fa-info-circle"></i> ${p.notes}</div>` : ''}
          <div class="card-actions">
            <button class="btn-action btn-detail" onclick="focusPoint(${p.no})">
              <i class="fa-solid fa-map-pin"></i> Lihat di Peta
            </button>
            <a class="btn-action btn-gmaps" href="${p.dir_url}" target="_blank">
              <i class="fa-solid fa-diamond-turn-right"></i> Buka GMaps
            </a>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function focusPoint(no) {
      const p = pointsData.find(x => x.no === no);
      if (p && markerMap[no]) {
        map.flyTo([p.lat, p.lon], 16, { duration: 0.8 });
        markerMap[no].openPopup();
        sheet.classList.remove('open');
        sheet.classList.add('peek');
      }
    }

    function setFilter(kat) {
      currentFilter = kat;
      document.querySelectorAll('.pill').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(kat === 'ALL' ? 'Semua' : kat.split(' ')[0]));
      });
      render();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      render();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      render();
    }

    render();
  </script>
</body>
</html>
